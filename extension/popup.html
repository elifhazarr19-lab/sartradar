<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>ŞartRadar</title>
  <style>
    body { width: 340px; padding: 15px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    h2 { margin: 0 0 5px 0; color: #1976d2; font-size: 20px; }
    .subtitle { margin: 0 0 15px 0; font-size: 12px; color: #666; }
    button { width: 100%; padding: 12px; background-color: #1976d2; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; margin-bottom: 10px; }
    button:hover { background-color: #115293; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    
    #loading { display: none; text-align: center; font-size: 13px; color: #555; margin: 15px 0; }
    #resultArea { display: none; margin-top: 15px; }
    
    .score-box { text-align: center; padding: 15px; background: #f9f9f9; border-radius: 8px; margin-bottom: 15px; border: 1px solid #eee; }
    .score-value { font-size: 28px; font-weight: bold; color: #d32f2f; }
    .summary { font-size: 13px; margin-bottom: 15px; line-height: 1.4; color: #333; }
    
    .finding-card { background: #fff3f3; border-left: 4px solid #d32f2f; padding: 10px; margin-bottom: 10px; border-radius: 0 4px 4px 0; }
    .finding-title { font-weight: bold; font-size: 13px; margin-bottom: 5px; color: #b71c1c; }
    .finding-quote { font-style: italic; font-size: 12px; background: #fff; padding: 6px; border: 1px dashed #ccc; margin-bottom: 5px; color: #555; }
    .finding-desc { font-size: 12px; color: #333; }
    
    .uncertainty-box { background: #fff8e1; border-left: 4px solid #ffb300; padding: 10px; font-size: 13px; color: #795548; margin-bottom: 15px; }
    .legal-warning { margin-top: 20px; padding: 10px; font-size: 10px; color: #777; border-top: 1px solid #ddd; text-align: justify; line-height: 1.3; }
  </style>
</head>
<body>
  <h2>ŞartRadar</h2>
  <p class="subtitle">Sözleşme ve Gizlilik Analiz Aracı</p>
  
  <button id="analyzeBtn">Sayfayı Analiz Et</button>
  
  <div id="loading">⏳ Sayfa okunuyor ve analiz ediliyor... Lütfen bekleyin.</div>
  
  <div id="resultArea">
    <div id="uncertaintyArea" class="uncertainty-box" style="display: none;"></div>
    
    <div id="scoreArea" class="score-box" style="display: none;">
      <div style="font-size: 12px; color: #666;">Risk Skoru (0-100)</div>
      <div id="riskScoreValue" class="score-value">0</div>
    </div>
    
    <div id="summaryArea" class="summary"></div>
    <div id="findingsList"></div>
  </div>

  <div class="legal-warning">
    <strong>UYARI:</strong> Bu araç hukuki tavsiye vermez. Analiz otomatik olarak oluşturulur ve hata içerebilir. Hukuki sonuç doğurabilecek kararlar için nitelikli bir hukuk uzmanına danışın.
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
